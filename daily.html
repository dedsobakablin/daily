<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ежедневник</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
<style>
  :root {
    --bg: #f7f5f2; --card: rgba(255, 255, 255, 0.95); --text: #2a2a2a; --muted: #8a8a8a;
    --accent: #c8a4a4; --accent2: #a4c8b8; --accent3: #a4b8c8; --accent4: #c8c4a4; --accent5: #b8a4c8;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif; color: var(--text); line-height: 1.6;
    padding: 24px 16px 80px; max-width: 900px; margin: 0 auto; min-height: 100vh;
    background-color: var(--bg); background-size: cover; background-position: center;
    background-attachment: fixed; background-repeat: no-repeat;
  }
  body::before { content: ''; position: fixed; inset: 0; background: rgba(var(--overlay-color), var(--overlay-opacity)); z-index: -1; }
  h1 { font-size: 30px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; color: #1a1a1a; text-shadow: 0 1px 3px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6); }
  .subtitle { font-size: 14px; font-style: italic; margin-bottom: 20px; color: #4a4a4a; text-shadow: 0 1px 2px rgba(255,255,255,0.9); background: rgba(255,255,255,0.5); display: inline-block; padding: 3px 12px; border-radius: 12px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .upload-label { padding: 6px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 12px; font-family: inherit; color: var(--text); box-shadow: var(--shadow); }
  .diamond-panel { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; background: linear-gradient(180deg, #e8f0f8 0%, #c8d8e8 100%); border: 2px solid #6a4a25; border-radius: 20px; font-size: 18px; color: #2a4a6a; box-shadow: 0 2px 8px rgba(0,0,0,0.2); margin-left: 12px; cursor: pointer; transition: all 0.15s; }
  .diamond-panel:hover { background: linear-gradient(180deg, #d8e8f8 0%, #b8c8d8 100%); }
  .diamond-icon { font-size: 20px; }
  .main-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .main-tab { padding: 8px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 14px; box-shadow: var(--shadow); }
  .main-tab.active { background: var(--text); color: white; border-color: var(--text); }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }

  .tab.active { background: var(--text); color: white; border-color: var(--text); }
  .tab.today { border-color: var(--accent); border-width: 2px; }
  .card { position: relative; background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); border-left: 4px solid var(--accent); }
  .card.drawing { border-left-color: var(--accent2); } .card.composition { border-left-color: var(--accent3); }
  .card.painting { border-left-color: var(--accent4); } .card.practice { border-left-color: var(--accent5); }
  .card.creative { border-left-color: #d4a4a4; } .card.life { border-left-color: #a4d4c8; }
  .card.custom { border-left-color: #9a8fa8; } .card.day { border-left-color: #c8b8a0; }
  .card h2 { font-size: 20px; font-weight: normal; margin-bottom: 4px; }
  .card .meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .card-delete { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 16px; opacity: 0; }
  .card:hover .card-delete { opacity: 1; }
  .card-finish { position: absolute; top: 12px; right: 44px; padding: 4px 10px; border-radius: 12px; background: transparent; border: 1px solid var(--border); cursor: pointer; font-size: 11px; color: var(--muted); font-family: inherit; }
  .card-finish:hover { border-color: var(--text); color: var(--text); }
  .card-restore { position: absolute; top: 12px; right: 44px; padding: 4px 10px; border-radius: 12px; background: transparent; border: 1px solid var(--border); cursor: pointer; font-size: 11px; color: var(--muted); font-family: inherit; }
  .card-restore:hover { border-color: #b04040; color: #b04040; }
  .progress-wrap { background: #eeeae5; border-radius: 8px; height: 8px; margin-bottom: 14px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--text); border-radius: 8px; }
  .task-block { padding: 8px 0; border-bottom: 1px dashed #eeeae5; }
  .task-block:last-child { border-bottom: none; }
  .task { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; user-select: none; }
  .task input[type="checkbox"] { appearance: none; width: 20px; height: 20px; min-width: 20px; border: 1.5px solid #ccc; border-radius: 5px; cursor: pointer; margin-top: 2px; position: relative; }
  .task input[type="checkbox"]:checked { background: var(--done); border-color: #9c9; }
  .task input[type="checkbox"]:checked::after { content: "✓"; position: absolute; top: -2px; left: 3px; color: #4a7a4a; font-size: 15px; font-weight: bold; }
  .task input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.7; }
  .task.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-text { flex: 1; }
  .task-actions { display: flex; gap: 4px; opacity: 0; }
  .task-block:hover .task-actions { opacity: 1; }
  .task-btn { background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 0 4px; }
  .task-btn.has-comment { color: var(--accent); opacity: 1; }
  .comment-display { margin: 6px 0 0 30px; font-size: 13px; font-style: italic; color: #5a5a5a; padding: 6px 10px; background: rgba(200, 164, 164, 0.12); border-left: 2px solid var(--accent); border-radius: 6px; white-space: pre-wrap; }
  .comment-editor { margin: 6px 0 0 30px; display: none; }
  .comment-editor.visible { display: block; }
  .comment-editor textarea { width: 100%; min-height: 50px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 13px; background: rgba(255,255,255,0.8); color: inherit; resize: vertical; }
  .comment-controls { display: flex; gap: 6px; margin-top: 6px; }
  .comment-controls button { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-family: inherit; color: var(--text); }
  .comment-controls button.save { background: var(--text); color: white; border-color: var(--text); }
  .add-task { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .add-task input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; background: rgba(255,255,255,0.7); color: inherit; }
  .add-task button { padding: 8px 14px; border-radius: 8px; border: none; background: var(--text); color: white; cursor: pointer; font-family: inherit; font-size: 14px; }
  .add-card-btn { display: block; width: 100%; padding: 14px; background: transparent; border: 1.5px dashed var(--border); border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .summary { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .summary .big { font-size: 32px; font-weight: bold; }
  .summary .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .top-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button.small, label.small-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-family: inherit; display: inline-flex; align-items: center; }
  button.small:hover, label.small-btn:hover { border-color: var(--text); color: var(--text); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2a2a2a; color: white; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-family: inherit; box-shadow: 0 4px 16px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  .toast.error { background: #b04040; }
  .empty-archive { text-align: center; padding: 40px 20px; color: var(--muted); font-style: italic; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); }
  .month-selector { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .month-tab { padding: 6px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px; box-shadow: var(--shadow); }
  .month-tab.active { background: var(--text); color: white; border-color: var(--text); }
  .archive-row { background: var(--card); border-radius: 10px; margin-bottom: 8px; box-shadow: var(--shadow); border-left: 4px solid #b0a8a0; overflow: hidden; }
  .archive-row-header { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; gap: 12px; user-select: none; }
  .archive-row-header:hover { background: rgba(0,0,0,0.02); }
  .archive-date { font-weight: bold; font-size: 15px; min-width: 60px; }
  .archive-day-name { font-size: 14px; color: var(--muted); min-width: 110px; }
  .archive-progress { flex: 1; font-size: 13px; color: var(--muted); }
  .archive-percent { font-size: 13px; font-weight: bold; min-width: 44px; text-align: right; }
  .archive-chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; }
  .archive-row.open .archive-chevron { transform: rotate(90deg); }
  .archive-row-body { display: none; padding: 0 16px 14px 16px; border-top: 1px dashed var(--border); }
  .archive-row.open .archive-row-body { display: block; }
  .archive-row-body .task-block { padding: 6px 0; }
  .archive-row-body .task input[type="checkbox"] { cursor: default; }
  .archive-restore-btn { margin-top: 10px; padding: 5px 12px; border-radius: 14px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 12px; font-family: inherit; color: var(--muted); }
  .archive-restore-btn:hover { border-color: #b04040; color: #b04040; }
  .health-panel { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); border-left: 4px solid #a4c8b8; margin-bottom: 16px; }
  .health-section { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px dashed var(--border); }
  .health-section:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .health-title { font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
  .health-days { display: flex; gap: 10px; flex-wrap: wrap; }
  .health-day { flex: 1; min-width: 90px; padding: 14px; border-radius: 10px; background: #f0ece6; border: 1.5px solid transparent; cursor: pointer; text-align: center; font-size: 18px; user-select: none; }
  .health-day:hover { border-color: #c8d8cc; }
  .health-day.done { background: var(--done); border-color: #9c9; color: #4a7a4a; }
  .health-day-label { font-size: 11px; color: var(--muted); display: block; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .health-day.done .health-day-label { color: #6a8a6a; }
  .water-glasses { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .water-glass { width: 40px; height: 50px; border: 2px solid #a4b8c8; border-radius: 4px 4px 8px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #a4b8c8; transition: all 0.15s; background: rgba(164, 184, 200, 0.08); }
  .water-glass:hover { border-color: #6a8aa8; }
  .water-glass.done { background: linear-gradient(180deg, #d8e8f8 0%, #a4c8e8 100%); border-color: #6a8aa8; color: white; }
  .water-count { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .water-count b { color: var(--text); font-size: 16px; }
  .vitamins-list { display: flex; flex-direction: column; gap: 10px; }
  .vitamin-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(164, 200, 184, 0.12); border-radius: 8px; cursor: pointer; user-select: none; }
  .vitamin-row:hover { background: rgba(164, 200, 184, 0.2); }
  .vitamin-row.done { background: var(--done); }
  .vitamin-row input[type="checkbox"] { appearance: none; width: 20px; height: 20px; border: 1.5px solid #ccc; border-radius: 5px; cursor: pointer; position: relative; background: white; }
  .vitamin-row input[type="checkbox"]:checked { background: #9c9; border-color: #6a8a6a; }
  .vitamin-row input[type="checkbox"]:checked::after { content: "✓"; position: absolute; top: -2px; left: 3px; color: white; font-size: 15px; font-weight: bold; }
  .vitamin-label { flex: 1; font-size: 14px; }
  .vitamin-time { font-size: 12px; color: var(--muted); margin-right: 8px; }
  .vitamin-row.done .vitamin-label { text-decoration: line-through; color: var(--muted); }
  .clean-panel { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); border-left: 4px solid #c8b8a0; }
  .clean-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .clean-title { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .clean-dacha-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-family: inherit; font-size: 13px; color: var(--muted); }
  .clean-dacha-btn:hover { border-color: var(--accent); color: var(--text); }
  .clean-dacha-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .clean-day { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(200, 184, 160, 0.12); border-radius: 8px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .clean-day:hover { background: rgba(200, 184, 160, 0.22); }
  .clean-day.done { background: var(--done); }
  .clean-day input[type="checkbox"] { appearance: none; width: 22px; height: 22px; border: 1.5px solid #ccc; border-radius: 5px; cursor: pointer; position: relative; background: white; }
  .clean-day input[type="checkbox"]:checked { background: #9c9; border-color: #6a8a6a; }
  .clean-day input[type="checkbox"]:checked::after { content: "✓"; position: absolute; top: -2px; left: 3px; color: white; font-size: 16px; font-weight: bold; }
  .clean-day-name { font-weight: bold; min-width: 100px; }
  .clean-day-zone { flex: 1; font-size: 14px; color: var(--text); }
  .clean-day.done .clean-day-zone, .clean-day.done .clean-day-name { text-decoration: line-through; color: var(--muted); }
  .clean-dacha-note { font-size: 13px; color: var(--muted); font-style: italic; padding: 10px; background: rgba(200, 184, 160, 0.15); border-radius: 6px; margin-top: 12px; }
  .shop-panel { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); border-left: 4px solid #a4b8c8; }
  .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; padding-bottom: 16px; border-bottom: 1px dashed var(--border); }
  .shop-title { font-size: 22px; color: var(--text); }
  .shop-balance { display: flex; align-items: center; gap: 8px; font-size: 20px; color: #2a4a6a; }
  .shop-item { padding: 18px; background: rgba(164, 184, 200, 0.12); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
  .shop-item-name { font-size: 20px; color: var(--text); margin-bottom: 6px; }
  .shop-item-desc { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .shop-item-price { font-size: 16px; color: #2a4a6a; margin-bottom: 10px; }
  .shop-buy { padding: 8px 20px; border-radius: 8px; border: 1px solid #6a4a25; background: linear-gradient(180deg, #e8f0f8 0%, #c8d8e8 100%); cursor: pointer; font-family: inherit; font-size: 15px; color: #2a4a6a; }
  .shop-buy:hover:not(:disabled) { background: linear-gradient(180deg, #d8e8f8 0%, #b8c8d8 100%); }
  .shop-buy:disabled { opacity: 0.5; cursor: not-allowed; }
  .shop-used { padding: 12px 16px; background: rgba(200, 164, 164, 0.15); border-left: 3px solid #c8a4a4; border-radius: 6px; font-size: 14px; color: #7a5a3a; font-style: italic; }
  .shop-note { font-size: 13px; color: var(--muted); margin-top: 16px; line-height: 1.7; }
  .shop-note b { color: var(--text); }
  .shop-limit { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .date-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .date-tab { padding: 6px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 12px; box-shadow: var(--shadow); }
  .date-tab.active { background: var(--text); color: white; border-color: var(--text); }
  .date-tab.today { border-color: var(--accent); border-width: 2px; }
  .fin-panel { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); border-left: 4px solid #b8c8a4; margin-bottom: 16px; }
  .fin-section { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px dashed var(--border); }
  .fin-section:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .fin-title { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 14px; }
  .fin-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .fin-row label { min-width: 130px; font-size: 14px; color: var(--text); }
  .fin-row input, .fin-row select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; background: rgba(255,255,255,0.8); color: inherit; flex: 1; min-width: 120px; }
  .fin-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #6a4a25; background: linear-gradient(180deg, #e8f0d8 0%, #c8d8b8 100%); cursor: pointer; font-family: inherit; font-size: 14px; color: #3a5a2a; }
  .fin-btn:hover { background: linear-gradient(180deg, #d8e8c8 0%, #b8c8a8 100%); }
  .fin-list { margin-top: 16px; }
  .fin-item { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px dashed var(--border); font-size: 14px; gap: 10px; }

  .fin-item .amount.minus { color: #b04040; }
  .fin-item .amount.plus { color: #4a7a4a; }

  .fin-delete:hover { color: #b04040; }
  .fin-totals { padding: 16px; background: rgba(184, 200, 164, 0.15); border-left: 3px solid #b8c8a4; border-radius: 6px; font-size: 14px; line-height: 2; }
  .fin-totals b { color: var(--text); font-size: 16px; }
  .auth-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #f7f5f2 0%, #e8e0d0 100%); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-box { background: white; border-radius: 16px; padding: 40px; max-width: 400px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.15); text-align: center; }
  .auth-box h2 { font-size: 24px; margin-bottom: 12px; color: #2a2a2a; font-weight: normal; }
  .auth-box p { font-size: 14px; color: #8a8a8a; margin-bottom: 24px; line-height: 1.6; }
  .auth-btn { background: linear-gradient(180deg, #4285f4 0%, #357ae8 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-family: inherit; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
  .auth-btn:hover { background: linear-gradient(180deg, #357ae8 0%, #2860c8 100%); }

</head>
<body>

<div id="authScreen" class="auth-screen" style="display:none;">
  <div class="auth-box">
    <h2>Мой ежедневник</h2>
    <p>Войди через Google, чтобы синхронизировать данные между устройствами.</p>
    <button class="auth-btn" onclick="signInWithGoogle()">
      <span class="google-icon">G</span>
      Войти через Google
    </button>
  </div>
</div>

<div id="app" style="display:none;">

function cardProgress(c){ const done=c.tasks.filter((_,i)=>isDone(c.id,i)).length; return {done,total:c.tasks.length}; }
function totalProgress(){
  let done=0,total=0;
  state.subjects.forEach(s=>{const p=cardProgress(s);done+=p.done;total+=p.total;});
  state.days.forEach(d=>{const p=cardProgress(d);done+=p.done;total+=p.total;});
  return {done,total};
}
function dateKey(d) {
  const dt = d || new Date();
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function getWeekKey() {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

let saveTimeout = null;

  if (!currentUser) return;

  clearTimeout(saveTimeout);

function renderCard(card, cls, metaOverride){
  const p=cardProgress(card);
  const percent= p.total? Math.round(p.done/p.total*100):0;
  const tasksHtml=card.tasks.map((t,i)=>{
    const done=isDone(card.id,i);
    const comment=getComment(card.id,i);
    const hasComment= comment && comment.trim().length>0;
    const commentBlock = hasComment ? '<div class="comment-display">'+escapeHtml(comment)+'</div>' : '';
    const editorBlock = '<div class="comment-editor" id="comment-editor-'+card.id+'-'+i+'"><textarea placeholder="Детали, заметки...">'+escapeHtml(comment)+'</textarea><div class="comment-controls"><button class="save" onclick="saveComment(\''+card.id+'\','+i+',this)">Сохранить</button><button onclick="hideComment(\''+card.id+'\','+i+')">Отмена</button></div></div>';
    return '<div class="task-block" data-key="'+card.id+'::'+i+'"><div class="task '+(done?'done':'')+'"><input type="checkbox" '+(done?'checked':'')+' onchange="toggle(\''+card.id+'\','+i+')"><span class="task-text">'+escapeHtml(t)+'</span><div class="task-actions"><button class="task-btn '+(hasComment?'has-comment':'')+'" onclick="event.preventDefault();showCommentEditor(\''+card.id+'\','+i+')">💬</button><button class="task-btn" onclick="event.preventDefault();deleteTask(\''+card.id+'\','+i+')">×</button></div></div>'+commentBlock+editorBlock+'</div>';
  }).join('');
  const isDay = !!state.days.find(d=>d.id===card.id);
  const finishBtn = isDay ? '<button class="card-finish" onclick="finishDay(\''+card.id+'\')">Завершить</button>' : '';
  const mealBlock = card.meal ? '<div style="margin-top:14px;padding:10px 14px;background:rgba(200,184,160,0.18);border-left:2px solid #c8b8a0;border-radius:6px;font-size:13px;font-style:italic;color:#5a5a5a;">🍽 ' + escapeHtml(card.meal) + '</div>' : '';
  const trainBlock = (() => {
    if (!['wed','fri','sun'].includes(card.id)) return '';
    return '<div style="margin-top:10px;padding:10px 14px;background:rgba(164,200,184,0.12);border-left:2px solid #a4c8b8;border-radius:6px;font-size:13px;color:#4a5a4a;">💪 Тренировка: ВК</div>';
  })();
  const cleanBlock = (() => {
    const c = state.clean;
    if (!c || !c.zones) return '';
    const notDone = Object.keys(c.zones).filter(k => !c.zones[k].doneAt);
    if (notDone.length === 0) return '<div style="margin-top:10px;padding:10px 14px;background:rgba(164,200,184,0.18);border-left:2px solid #a4c8b8;border-radius:6px;font-size:13px;color:#4a5a4a;">🧹 Все зоны убраны на этой неделе 🎉</div>';
    const names = notDone.map(k => c.zones[k].name).join(', ');
    return '<div style="margin-top:10px;padding:10px 14px;background:rgba(200,184,160,0.12);border-left:2px solid #c8b8a0;border-radius:6px;font-size:13px;color:#5a5a5a;">🧹 Осталось убрать: ' + escapeHtml(names) + '</div>';
  })();
  return '<div class="card '+cls+'"><button class="card-delete" onclick="deleteCard(\''+card.id+'\')">×</button>'+finishBtn+'<h2>'+escapeHtml(card.name)+'</h2><div class="meta">'+escapeHtml(metaOverride||card.meta||'')+' · '+p.done+'/'+p.total+' · '+percent+'%</div><div class="progress-wrap"><div class="progress-bar" style="width:'+percent+'%"></div></div>'+tasksHtml+mealBlock+trainBlock+cleanBlock+'<div class="add-task"><input type="text" placeholder="Новая задача..." onkeydown="if(event.key===\'Enter\')addTask(\''+card.id+'\',this)"><button onclick="addTaskFromBtn(\''+card.id+'\',this)">+</button></div></div>';
}

function toggle(a,b){
  const k=taskKey(a,b);
  const was = !!state.done[k];
  state.done[k] = !was;
  const isGoalCard = state.subjects.some(s => s.id === a);
  if (isGoalCard) {
    const card = state.subjects.find(s => s.id === a);
    if (!was && state.done[k]) { state.diamonds = (state.diamonds||0) + 5; logDiamonds(5, 'Задача в цели: ' + (card ? card.name : a)); showToast('+5 💎'); }
    else if (was && !state.done[k]) { state.diamonds = Math.max(0,(state.diamonds||0) - 5); logDiamonds(-5, 'Снята задача: ' + (card ? card.name : a)); showToast('-5 💎', true); }
    checkCardCompletion(a);
  }
  saveState(); render();
}
function checkCardCompletion(cardId) {
  const card = state.subjects.find(s => s.id === cardId);
  if (!card) return;
  const allDone = card.tasks.length > 0 && card.tasks.every((_, i) => isDone(cardId, i));
  const alreadyBonus = state.completedCards && state.completedCards[cardId];
  if (allDone && !alreadyBonus) {
    state.diamonds = (state.diamonds||0) + 25;
    logDiamonds(25, 'Бонус: ' + card.name);
    showToast('🎉 Карточка закрыта! +25 💎');
    state.completedCards = state.completedCards || {};
    state.completedCards[cardId] = true;
  } else if (!allDone && alreadyBonus) {
    state.diamonds = Math.max(0,(state.diamonds||0) - 25);
    logDiamonds(-25, 'Снят бонус: ' + card.name);
    delete state.completedCards[cardId];
  }
  saveState();
}

function renderHealth(){
  const el = document.getElementById('content');
  const today = new Date();
  const todayStr = dateKey(today);
  if (!healthViewDate) healthViewDate = todayStr;
  const dates = [];
  for (let i = 0; i < 7; i++) { const d = new Date(today); d.setDate(d.getDate() - i); dates.push(d); }
  const dateTabs = dates.map(d => {
    const ds = dateKey(d); const isToday = ds === todayStr;
    const dayNames = ['вс','пн','вт','ср','чт','пт','сб'];
    const label = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' ' + dayNames[d.getDay()];
    return '<div class="date-tab '+(healthViewDate===ds?'active':'')+' '+(isToday?'today':'')+'" onclick="setHealthDate(\''+ds+'\')">'+label+'</div>';
  }).join('');
  const h = getHealth(healthViewDate);
  const dayOfWeek = new Date(healthViewDate + 'T12:00:00').getDay();
  const dayId = ['sun','mon','tue','wed','thu','fri','sat'][dayOfWeek];
  const isTrainingDay = ['wed','fri','sun'].includes(dayId);
  const isWeekendDay = ['sat','sun'].includes(dayId);
  let trainingHtml;
  if (isTrainingDay) {
    const done = !!h.training;
    trainingHtml = '<div class="health-day '+(done?'done':'')+'" onclick="toggleTrainingDate()" style="max-width:120px;"><span class="health-day-label">'+dayId+'</span>'+(done?'✓':'—')+'</div>';
  } else {
    const trainingDays = [3, 5, 0];
    const todayD = new Date(healthViewDate + 'T12:00:00');
    const todayDow = todayD.getDay();
    let daysAhead = 0;
    for (let i = 1; i <= 7; i++) { const check = (todayDow + i) % 7; if (trainingDays.includes(check)) { daysAhead = i; break; } }
    const nextDate = new Date(todayD); nextDate.setDate(nextDate.getDate() + daysAhead);
    const nextStr = String(nextDate.getDate()).padStart(2,'0') + '.' + String(nextDate.getMonth()+1).padStart(2,'0');
    const label = daysAhead === 1 ? 'завтра' : nextStr;
    trainingHtml = '<div style="font-size:13px;color:var(--muted);font-style:italic;">Сегодня не тренировочный день. Ближайшая тренировка: '+label+' — Тренировка ВК.</div>';
  }
  const waterHtml = Array.from({length: 5}, (_, i) => '<div class="water-glass '+(i < h.water ? 'done' : '')+'" onclick="setWaterDate('+(i+1)+')">💧</div>').join('');
  const vitaminSlots = [
    { id:'morning', label:'Утро', sub:'Омега-3, C, D3' },
    { id:'noon', label:'Обед', sub:'Омега-3, D3, B12' },
    { id:'evening', label:'Ужин', sub:'Омега-3, D3, Цинк' }
  ];

function setHealthDate(ds) { healthViewDate = ds; renderHealth(); }
function getCurrentDayId() { const d = new Date(healthViewDate + 'T12:00:00'); return ['sun','mon','tue','wed','thu','fri','sat'][d.getDay()]; }
function toggleTrainingDate() { const h = getHealth(healthViewDate); h.training = !h.training; saveState(); renderHealth(); }
function setWaterDate(n) { const h = getHealth(healthViewDate); h.water = (n === h.water) ? 0 : n; saveState(); renderHealth(); }
function toggleVitaminDate(slot) { const h = getHealth(healthViewDate); h.vitamins[slot] = !h.vitamins[slot]; saveState(); renderHealth(); }
function markSleepNow() { const now = new Date(); const hh = String(now.getHours()).padStart(2,'0'); const mm = String(now.getMinutes()).padStart(2,'0'); setSleepTime(hh + ':' + mm); }
function setSleepTime(timeStr) {
  if (!/^\d{1,2}:\d{2}$/.test(timeStr)) { showToast('Введи время в формате ЧЧ:ММ', true); return; }
  const [hhStr, mmStr] = timeStr.split(':');
  const hh = parseInt(hhStr, 10); const mm = parseInt(mmStr, 10);
  if (isNaN(hh) || isNaN(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) { showToast('Некорректное время', true); return; }
  const h = getHealth(healthViewDate);
  const dayId = getCurrentDayId();
  const nextDayMap = { 'sun':'mon', 'mon':'tue', 'tue':'wed', 'wed':'thu', 'thu':'fri', 'fri':'sat', 'sat':'sun' };
  const nextDay = nextDayMap[dayId];
  const isOfficeTomorrow = ['mon','thu'].includes(nextDay);
  const isWeekendTomorrow = ['sat','sun'].includes(nextDay);
  let totalMin = hh * 60 + mm;
  if (totalMin < 300) totalMin += 1440;
  let status = 'bad';
  if (isWeekendTomorrow) {
    if (totalMin >= 1440 && totalMin <= 1500) status = 'good';
    else if (totalMin > 1500 && totalMin <= 1530) status = 'ok';
    else status = 'bad';
  } else if (isOfficeTomorrow) {
    if (totalMin >= 1320 && totalMin <= 1410) status = 'good';
    else if (totalMin > 1410 && totalMin <= 1440) status = 'ok';
    else status = 'bad';
  } else {
    if (totalMin >= 1320 && totalMin <= 1440) status = 'good';
    else if (totalMin > 1440 && totalMin <= 1470) status = 'ok';
    else status = 'bad';
  }
  h.sleep = { time: timeStr, status: status };
  saveState();
  renderHealth();
  showToast('Отбой: ' + timeStr);
}
function clearSleep() { const h = getHealth(healthViewDate); h.sleep = null; saveState(); renderHealth(); showToast('Отбой снят'); }

function toggleCleanZone(key) {

function renderArchiveMonth(){
  if (!state.archive || state.archive.length === 0) return '<div class="empty-archive">Архив пуст. Заверши день — он появится здесь.</div>';
  const byMonth = {};
  state.archive.forEach((entry, idx) => {
    const dateStr = entry.dayDate || entry.archivedAt || '';
    let key = 'Без даты';
    const m = dateStr.match(/(\d{4})-(\d{2})/);
    if (m) key = m[2] + '.' + m[1];
    else {
      const m2 = dateStr.match(/(\d{2})\.(\d{2})\.(\d{4})/);
      if (m2) key = m2[2] + '.' + m2[3];
    }
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push({ entry, idx });
  });
  const months = Object.keys(byMonth).sort((a,b) => {
    const [am, ay] = a.split('.').map(Number);
    const [bm, by] = b.split('.').map(Number);
    if (ay !== by) return by - ay;
    return bm - am;
  });
  if (!window._archiveMonth || !months.includes(window._archiveMonth)) window._archiveMonth = months[0];
  const names = {'01':'Январь','02':'Февраль','03':'Март','04':'Апрель','05':'Май','06':'Июнь','07':'Июль','08':'Август','09':'Сентябрь','10':'Октябрь','11':'Ноябрь','12':'Декабрь'};
  const tabs = months.map(mk => { const [mm, yy] = mk.split('.'); return '<div class="month-tab '+(window._archiveMonth===mk?'active':'')+'" onclick="setArchiveMonth(\''+mk+'\')">'+(names[mm] ? names[mm] + ' ' + yy : mk)+'</div>'; }).join('');
  const entries = byMonth[window._archiveMonth] || [];
  const openSet = window._archiveOpen || new Set();
  const rows = entries.slice().sort((a,b) => b.idx - a.idx).map(({entry, idx}) => renderArchiveRow(entry, idx, openSet)).join('');
  return '<div class="month-selector">'+tabs+'</div>' + rows;
}
function setArchiveMonth(mk){ window._archiveMonth = mk; window._archiveOpen = new Set(); render(); }
function toggleArchiveRow(id){ if (!window._archiveOpen) window._archiveOpen = new Set(); if (window._archiveOpen.has(id)) window._archiveOpen.delete(id); else window._archiveOpen.add(id); render(); }

function finishDay(cardId){
  const card = state.days.find(d => d.id === cardId);
  if (!card) return;
  if (!confirm('Завершить день? Он уйдёт в архив.')) return;
  const today = new Date();
  const todayIdx = today.getDay();
  const dayOrder = ['mon','tue','wed','thu','fri','sat','sun'];
  const targetIdx = dayOrder.indexOf(cardId);
  const todayOrder = todayIdx === 0 ? 6 : todayIdx - 1;
  let diff = todayOrder - targetIdx;
  if (diff < 0) diff += 7;
  const targetDate = new Date(today);
  targetDate.setDate(today.getDate() - diff);
  const targetStr = dateKey(targetDate);
  const dayId = cardId;
  const isTrainingDay = ['wed','fri','sun'].includes(dayId);
  const h = getHealth(targetStr);
  let earned = 0; let penalty = 0;
  if (isTrainingDay && h.training) { earned += 15; logDiamonds(15, 'Тренировка (' + targetStr + ')', targetStr); }
  if (isTrainingDay && !h.training) { penalty += 15; logDiamonds(-15, 'Пропуск: тренировка (' + targetStr + ')', targetStr); }
  if (h.water > 0) { earned += h.water; logDiamonds(h.water, 'Вода: ' + h.water + '/5 (' + targetStr + ')', targetStr); }
  const vitCount = ['morning','noon','evening'].filter(v => h.vitamins[v]).length;
  ['morning','noon','evening'].forEach(v => { if (h.vitamins[v]) { earned += 1; logDiamonds(1, 'Витамины: ' + v + ' (' + targetStr + ')', targetStr); } else { penalty += 1; logDiamonds(-1, 'Пропуск: витамины ' + v + ' (' + targetStr + ')', targetStr); } });
  if (h.sleep) { if (h.sleep.status === 'good') { earned += 10; logDiamonds(10, 'Сон: ' + h.sleep.time + ' (' + targetStr + ')', targetStr); } else if (h.sleep.status === 'ok') { earned += 5; logDiamonds(5, 'Сон: ' + h.sleep.time + ' (' + targetStr + ')', targetStr); } else { penalty += 5; logDiamonds(-5, 'Сон: поздний ' + h.sleep.time + ' (' + targetStr + ')', targetStr); } } else { penalty += 5; logDiamonds(-5, 'Пропуск: сон (' + targetStr + ')', targetStr); }
  const cardTasksTotal = card.tasks.length;
  const cardTasksDone = card.tasks.filter((_, i) => isDone(cardId, i)).length;
  const fullDay = cardTasksTotal > 0 && cardTasksDone === cardTasksTotal;
  let dayBonus = 0;
  if (fullDay) { dayBonus = 15; earned += dayBonus; logDiamonds(dayBonus, '🎯 Бонус 100% дня (' + targetStr + ')', targetStr); }
  const net = earned - penalty;
  const before = state.diamonds || 0;
  state.diamonds = Math.max(0, before + net);
  h.applied = { diamonds: earned, penalty: penalty, closed: true, bonus: dayBonus, fullDay: fullDay };
  const targetDateObj = new Date(targetStr + 'T12:00:00');
  const archivedLabel = String(targetDateObj.getDate()).padStart(2,'0') + '.' + String(targetDateObj.getMonth()+1).padStart(2,'0') + '.' + targetDateObj.getFullYear();
  const entryTasks = card.tasks.map((t, i) => ({ text: t, done: isDone(cardId, i), comment: getComment(cardId, i) }));
  const entry = { id: cardId + '_' + Date.now(), name: card.name, archivedAt: archivedLabel, dayDate: targetStr, tasks: entryTasks };
  state.archive.push(entry);
  card.tasks = [];
  Object.keys(state.done).forEach(k => { if (k.indexOf(cardId + '::') === 0) delete state.done[k]; });
  Object.keys(state.comments).forEach(k => { if (k.indexOf(cardId + '::') === 0) delete state.comments[k]; });
  saveState();
  if (net > 0) showToast('День закрыт. +' + net + ' 💎');
  else if (net < 0) showToast('День закрыт. ' + net + ' 💎', true);
  else showToast('День закрыт.');
  render();
}

function restoreDay(archiveIdx){

}

function getCutoffDateStr(daysBack) {
  const d = new Date();
  d.setDate(d.getDate() - daysBack);
  return dateKey(d);
}

function exportData(full){
  const cutoff = full ? null : getCutoffDateStr(EXPORT_DAYS);
  const keepByDate = (dateStr) => {
    if (!cutoff) return true;
    if (!dateStr) return false;
    return dateStr >= cutoff;
  };

  const archiveFiltered = (state.archive || []).filter(e => keepByDate(e.dayDate));
  const healthFiltered = {};
  Object.keys(state.healthByDate || {}).forEach(k => { if (keepByDate(k)) healthFiltered[k] = state.healthByDate[k]; });
  const logFiltered = (state.diamondLog || []).filter(e => keepByDate(e.date));

  const toExport = {
    subjects: state.subjects,
    days: state.days,
    done: state.done,
    comments: state.comments,
    archive: archiveFiltered,
    mealPlan: state.mealPlan || null,
    diamonds: state.diamonds || 0,
    shop: state.shop || { purchasesThisWeek: 0, lastResetWeek: null },
    completedCards: state.completedCards || {},
    clean: state.clean || JSON.parse(JSON.stringify(DEFAULT_CLEAN)),
    healthByDate: healthFiltered,
    diamondLog: logFiltered,
    finance: state.finance || { incomes: [], expenses: [] }
  };
  if (state.goals) toExport.goals = state.goals;

  const suffix = full ? 'full' : 'week';
  const blob = new Blob([JSON.stringify(toExport, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'daily-backup-' + new Date().toISOString().slice(0,10) + '-' + suffix + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast(full ? 'Полная история экспортирована' : 'Экспорт за 7 дней');
}

function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.subjects && data.done){
        if(!data.days) data.days=JSON.parse(JSON.stringify(DEFAULT_DAYS));
        if(!data.comments) data.comments={};
        if(!data.archive) data.archive = [];
        if(!data.mealPlan) data.mealPlan = JSON.parse(JSON.stringify(DEFAULT_MEAL_PLAN));
        if(typeof data.diamonds !== 'number') data.diamonds = 0;
        if(!data.shop) data.shop = { purchasesThisWeek: 0, lastResetWeek: null };
        if(!data.completedCards) data.completedCards = {};
        if(!data.clean || !data.clean.zones) data.clean = JSON.parse(JSON.stringify(DEFAULT_CLEAN));
        if(!data.healthByDate) data.healthByDate = {};
        if(!data.diamondLog) data.diamondLog = [];
        if(!data.finance) data.finance = { incomes: [], expenses: [] };
        if(typeof data._updatedAt !== 'number') data._updatedAt = Date.now();

        const localArchive = state.archive || [];
        const fileArchive = data.archive || [];
        const byId = new Map();
        localArchive.forEach(entry => byId.set(entry.id, entry));
        fileArchive.forEach(entry => byId.set(entry.id, entry));
        data.archive = Array.from(byId.values());

        const localHealth = state.healthByDate || {};
        const fileHealth = data.healthByDate || {};
        data.healthByDate = Object.assign({}, localHealth, fileHealth);

        const localLog = state.diamondLog || [];
        const fileLog = data.diamondLog || [];
        const seenTs = new Set();
        const mergedLog = [];
        localLog.concat(fileLog).forEach(entry => { if (!seenTs.has(entry.ts)) { seenTs.add(entry.ts); mergedLog.push(entry); } });
        mergedLog.sort((a,b) => a.ts - b.ts);
        data.diamondLog = mergedLog;

        state = data;
        saveState(); render();
        showToast('Импорт прошёл успешно');
      } else showToast('Неверный формат файла', true);
    } catch(err){ showToast('Ошибка: '+err.message, true); }
  };
  reader.readAsText(file); ev.target.value='';
}

async function loadUserData(user) {
  document.getElementById('loadingScreen').style.display = 'block';
  document.getElementById('app').style.display = 'none';

  try {
    const cached = localStorage.getItem('daily_cache_' + user.uid);
    if (cached) {
      const cachedState = JSON.parse(cached);
      if (cachedState && cachedState.subjects) {
        state = cachedState;
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('userAvatar').src = user.photoURL || '';
        document.getElementById('userName').textContent = user.displayName || user.email || '';
        render();
      }
    }
  } catch(e) {}

  const ref = doc(db, 'users', user.uid, 'data', 'state');
  try {
    const snap = await getDoc(ref);
    if (snap.exists()) {
      state = snap.data();
      if (typeof state._updatedAt !== 'number') state._updatedAt = 0;
    } else {
      const cached = localStorage.getItem('daily_cache_' + user.uid);
      if (cached) {
        if (confirm('В облаке нет данных. Перенести текущие локальные данные в облако?')) {
          state = JSON.parse(cached);
          if (typeof state._updatedAt !== 'number') state._updatedAt = Date.now();
          await setDoc(ref, state);
        } else {
          state = defaultState();
          await setDoc(ref, state);
        }
      } else {
        state = defaultState();
        await setDoc(ref, state);
      }
    }
  } catch(e) {
    console.error('Load error:', e);
    if (!state) state = defaultState();
    showToast('Ошибка загрузки: ' + e.message, true);
  }

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userAvatar').src = user.photoURL || '';
  document.getElementById('userName').textContent = user.displayName || user.email || '';
  render();

  if (unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = onSnapshot(ref, (snap) => {
    if (!snap.exists() || isRendering) return;
    if (saveTimeout) return;
    const cloudData = snap.data();
    const cloudTs = typeof cloudData._updatedAt === 'number' ? cloudData._updatedAt : 0;
    const localTs = typeof state._updatedAt === 'number' ? state._updatedAt : 0;
    if (cloudTs <= localTs) return;
    state = cloudData;
    try { localStorage.setItem('daily_cache_' + user.uid, JSON.stringify(state)); } catch(e){}
    render();
  });
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    document.getElementById('authScreen').style.display = 'none';
    await loadUserData(user);
  } else {
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loadingScreen').style.display = 'none';
  }
});
